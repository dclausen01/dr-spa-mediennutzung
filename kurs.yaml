# Kursbeschreibung – Mediennutzung reflektieren und Medienerziehung (DR-Materialpool SPA, Querschnitts-Lernpfad K7)
titel: Mediennutzung reflektieren und Medienerziehung
kurzname: dr-spa-mediennutzung
ueberschrift: Mediennutzung reflektieren und Medienerziehung
untertitel: Sie denken über Ihre eigene Mediennutzung nach – und lernen, Kinder und Eltern beim Umgang mit Medien gut zu begleiten.
badges: [SPA, K7 Mediennutzung, "2 Stufen · ca. 6 Std."]
fusszeile: BBZ Rendsburg-Eckernförde · Abteilung SPA · Materialpool Digitaler Raum · Stand 11/2026
logo_zeichen: "▶"
sprache: de
anrede: sie
notizfrage: "Was nehmen Sie mit – für Ihre eigene Mediennutzung und für Ihre Arbeit in Kita, OGS oder Grundschule?"

einleitung: |
  :::notiz 👉 Worum geht es?
  Medien gehören zu Ihrem Alltag – und zum Alltag der Kinder, mit denen Sie arbeiten. Als Fachkraft sind Sie **Vorbild**: Kinder und Eltern merken, wie Sie selbst mit dem Handy umgehen.

  Deshalb beginnt dieser Lernpfad bei **Ihnen**: Stufe 1 „Ich und Medien“. Danach geht es um **Kinder und Eltern**: Stufe 2 „Kinder und Medien“. Jede Stufe passt in einen DR-Tag.
  :::

  :::tipp So arbeiten Sie mit dem Lernpfad
  1. Machen Sie zuerst den **Selbstcheck** unten.
  2. Arbeiten Sie die Module einer Stufe der Reihe nach durch.
  3. Ihre eigenen Mediendaten (zum Beispiel die Bildschirmzeit) bleiben **privat**. Sie geben nur Ihre Gedanken dazu ab.
  4. Alle Fälle sind **erfunden**. Verwenden Sie keine echten Namen aus Ihrer Praxis.
  :::

